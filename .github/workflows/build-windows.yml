name: Build Papers for Windows

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      diagnose:
        description: Build with debug symbols and capture crash backtraces under gdb
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.diagnose || false }}
  cancel-in-progress: true

env:
  PAPERS_VERSION: '50.2'
  PAPERS_BUILDTYPE: ${{ inputs.diagnose && 'debugoptimized' || 'release' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
          pacboy: >-
            toolchain:p
            meson:p
            ninja:p
            pkgconf:p
            rust:p
            gtk4:p
            libadwaita:p
            poppler:p
            poppler-data:p
            djvulibre:p
            libtiff:p
            libarchive:p
            libspelling:p
            libxml2:p
            blueprint-compiler:p
            gettext-tools:p
            desktop-file-utils:p
            glib2:p
            glib-networking:p
            librsvg:p
            webp-pixbuf-loader:p
            adwaita-icon-theme:p
            hicolor-icon-theme:p
            python-pillow:p
            gdb:p

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            _work/papers/build/cargo-home/registry
            _work/papers/build/cargo-home/git
            _work/papers/build/shell/src/release
          key: cargo-${{ env.PAPERS_BUILDTYPE }}-${{ env.PAPERS_VERSION }}-${{ hashFiles('ci/port-to-windows.py', 'packaging/papers.rc') }}
          restore-keys: |
            cargo-${{ env.PAPERS_BUILDTYPE }}-${{ env.PAPERS_VERSION }}-

      - name: Build
        run: bash ci/build.sh

      - name: Bundle runtime
        run: bash ci/bundle.sh

      - name: Make sample documents
        run: |
          set -e
          S=_work/samples
          python ci/make-samples.py "$S"
          if command -v c44 >/dev/null && command -v djvm >/dev/null; then
            for i in 1 2 3; do c44 "$S/djvu-page$i.ppm" "$S/djvu-page$i.djvu"; done
            djvm -c "$S/sample.djvu" "$S"/djvu-page1.djvu "$S"/djvu-page2.djvu "$S"/djvu-page3.djvu
          else
            echo "DjVuLibre encoders not available; skipping the DjVu sample"
          fi
          (cd "$S/pages" && bsdtar --format 7zip -cf ../sample.cb7 page*.png) || echo "no bsdtar; skipping .cb7"
          ls -la "$S"

      - name: Smoke test
        continue-on-error: true
        shell: pwsh
        run: ./ci/smoke-test.ps1 -Bundle _work/dist/Papers -Samples _work/samples -OutDir _work/smoke

      - name: Diagnose presentation mode exit
        if: inputs.diagnose
        continue-on-error: true
        shell: pwsh
        run: ./ci/diagnose.ps1 -Bundle _work/dist/Papers -Document "$PWD\_work\samples\sample.pdf" -OutDir _work/diag -Gdb "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\gdb.exe"

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$env:PAPERS_VERSION" "/DSourceDir=$PWD\_work\dist\Papers" "/DOutputDir=$PWD\_work\out" packaging\papers.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path _work\dist\Papers -DestinationPath "_work\out\Papers-$env:PAPERS_VERSION-windows-x64-portable.zip"
          Get-ChildItem _work\out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: papers-${{ env.PAPERS_VERSION }}-windows-x64
          path: _work/out/*
          compression-level: 0

      - name: Publish release
        if: github.ref == 'refs/heads/main' && !inputs.diagnose
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "papers-$env:PAPERS_VERSION-windows"
          gh release delete $tag --yes --cleanup-tag 2>$null
          $notes = "GNOME Papers $env:PAPERS_VERSION built for Windows x64 (run $env:GITHUB_RUN_NUMBER, commit $env:GITHUB_SHA).`n`nInstall with the setup .exe, or unzip the portable build and run Papers\bin\papers.exe."
          gh release create $tag (Get-ChildItem _work\out\*).FullName --title "Papers $env:PAPERS_VERSION for Windows" --notes $notes --target $env:GITHUB_SHA

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            _work/logs
            _work/smoke
            _work/diag
          if-no-files-found: ignore
