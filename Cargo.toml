[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.88"
repository = "https://github.com/cyborgcode/papers-windows"

[workspace.dependencies]
papers-render = { path = "crates/papers-render" }
papers-update = { path = "crates/papers-update" }

egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "persistence",
    "system_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest"] }
rayon = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep debug builds usable: pixel loops and image decoding are slow without optimisation.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.papers-render]
opt-level = 3
